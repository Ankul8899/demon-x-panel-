
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEMON X PANEL V2.0</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #151515;
            border: 1px solid #ff2020;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 0 20px #ff000044;
        }

        h1 {
            color: #ff2020;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #ff4545;
        }

        select, input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 9px;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #ff2020;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .item {
            background: #252525;
            padding: 13px;
            margin: 9px 0;
            border-radius: 9px;
            display: flex;
            justify-content: space-between;
        }

        .value {
            color: #ff3939;
            font-weight: bold;
        }

        .note {
            color: #aaa;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DEMON X PANEL</h1>
    <p class="subtitle">V2.0 | SMART SENSITIVITY</p>

    <label>Phone Model</label>
    <input id="phone" placeholder="Enter phone model">

    <label>DPI</label>
    <input id="dpi" type="number" value="400">

    <label>Gameplay Style</label>
    <select id="style">
        <option value="balanced">Balanced</option>
        <option value="rush">Rush / Aggressive</option>
        <option value="precision">Precision</option>
    </select>

    <button onclick="generate()">GENERATE SENSITIVITY</button>

    <div class="result" id="result">
        <h2 style="color:#ff2020">YOUR SETTINGS</h2>

        <div class="item">General <span class="value" id="general"></span></div>
        <div class="item">Red Dot <span class="value" id="red_dot"></span></div>
        <div class="item">2X Scope <span class="value" id="scope_2x"></span></div>
        <div class="item">4X Scope <span class="value" id="scope_4x"></span></div>
        <div class="item">Fire Button <span class="value" id="fire_button"></span></div>

        <button onclick="copySettings()">COPY ALL SETTINGS</button>
    </div>

    <p class="note">
        Recommended starting presets only. Test and adjust
        settings according to your gameplay.
    </p>

</div>

<script>
async function generate() {
    const dpi = Number(document.getElementById("dpi").value);

    if (!Number.isInteger(dpi) || dpi < 200 || dpi > 800) {
        alert("Enter DPI between 200 and 800");
        return;
    }

    try {
        const response = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                phone: document.getElementById("phone").value,
                dpi: dpi,
                style: document.getElementById("style").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Generation failed");
            return;
        }

        Object.keys(data).forEach(key => {
            document.getElementById(key).textContent = data[key];
        });

        document.getElementById("result").style.display = "block";

    } catch (error) {
        alert("Server connection failed. Try again.");
    }
}

function copySettings() {
    const keys = ["general", "red_dot", "scope_2x", "scope_4x", "fire_button"];

    const output = keys.map(key =>
        key.toUpperCase() + ": " +
        document.getElementById(key).textContent
    ).join("\n");

    navigator.clipboard.writeText(output)
        .then(() => alert("Settings copied!"))
        .catch(() => alert("Copy failed. Try HTTPS."));
}
</script>

</body>
</html>
