<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demon X Sensitivity Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0;
            font-size: 30px;
        }

        .title p {
            color: #aaa;
            margin-top: 8px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,.35);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0d0d0d;
            color: white;
            outline: none;
        }

        select:focus {
            border-color: #777;
        }

        .modes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .mode {
            padding: 13px 5px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0d0d0d;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .mode.active {
            border-color: white;
            background: #252525;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(.98);
        }

        .result {
            display: none;
        }

        .setting {
            background: #0d0d0d;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .setting span {
            display: block;
            color: #999;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .setting strong {
            font-size: 22px;
        }

        .sens-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .regen {
            margin-top: 15px;
        }

        .status {
            text-align: center;
            color: #aaa;
            margin: 10px 0;
            min-height: 20px;
        }

        @media(max-width: 400px) {
            .modes {
                grid-template-columns: 1fr;
            }

            .sens-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>DEMON X</h1>
        <p>Sensitivity Generator</p>
    </div>

    <div class="card">

        <label>Phone Brand</label>

        <select id="phone">
            <option value="oppo">OPPO</option>
            <option value="vivo">Vivo</option>
            <option value="realme">Realme</option>
            <option value="samsung">Samsung</option>
            <option value="xiaomi">Xiaomi</option>
            <option value="oneplus">OnePlus</option>
            <option value="iqoo">iQOO</option>
            <option value="other">Other</option>
        </select>


        <label>RAM</label>

        <select id="ram">
            <option value="2">2 GB</option>
            <option value="3">3 GB</option>
            <option value="4">4 GB</option>
            <option value="6" selected>6 GB</option>
            <option value="8">8 GB</option>
            <option value="12">12 GB</option>
            <option value="16">16 GB</option>
        </select>


        <label>Phone Model</label>

        <select id="model">
            <option value="Oppo A16">Oppo A16</option>
            <option value="Oppo A6x 5G">Oppo A6x 5G</option>
            <option value="Vivo Y Series">Vivo Y Series</option>
            <option value="Realme C Series">Realme C Series</option>
            <option value="Samsung A Series">Samsung A Series</option>
            <option value="Redmi Note Series">Redmi Note Series</option>
            <option value="OnePlus Nord">OnePlus Nord</option>
            <option value="Custom">Custom Model</option>
        </select>


        <label>Control Style</label>

        <div class="modes">

            <div class="mode active"
                 data-mode="one_tap"
                 onclick="selectMode(this)">
                ONE TAP
            </div>

            <div class="mode"
                 data-mode="drag"
                 onclick="selectMode(this)">
                DRAG
            </div>

            <div class="mode"
                 data-mode="balanced"
                 onclick="selectMode(this)">
                BALANCED
            </div>

        </div>

        <button onclick="generateSettings()">
            GENERATE SENSITIVITY
        </button>

        <div class="status" id="status"></div>

    </div>


    <div class="card result" id="result">

        <h2>Generated Settings</h2>

        <div class="setting">
            <span>Phone</span>
            <strong id="rPhone"></strong>
        </div>

        <div class="setting">
            <span>RAM</span>
            <strong id="rRam"></strong>
        </div>

        <div class="setting">
            <span>Phone Model</span>
            <strong id="rModel"></strong>
        </div>

        <div class="setting">
            <span>DPI</span>
            <strong id="rDpi"></strong>
        </div>

        <div class="setting">
            <span>Fire Button Size</span>
            <strong id="rFire"></strong>
        </div>

        <h3>Sensitivity</h3>

        <div class="sens-grid">

            <div class="setting">
                <span>General</span>
                <strong id="general"></strong>
            </div>

            <div class="setting">
                <span>Red Dot</span>
                <strong id="red_dot"></strong>
            </div>

            <div class="setting">
                <span>2X Scope</span>
                <strong id="scope2"></strong>
            </div>

            <div class="setting">
                <span>4X Scope</span>
                <strong id="scope4"></strong>
            </div>

            <div class="setting">
                <span>Sniper</span>
                <strong id="sniper"></strong>
            </div>

            <div class="setting">
                <span>Free Look</span>
                <strong id="free"></strong>
            </div>

        </div>

        <button class="regen"
                onclick="generateSettings()">
            🔄 REGENERATE
        </button>

    </div>

</div>


<script>

let selectedMode = "one_tap";


function selectMode(element) {

    document.querySelectorAll(".mode")
        .forEach(x => x.classList.remove("active"));

    element.classList.add("active");

    selectedMode = element.dataset.mode;
}


async function generateSettings() {

    const status = document.getElementById("status");

    status.innerText = "Generating settings...";

    const data = {
        phone: document.getElementById("phone").value,
        ram: document.getElementById("ram").value,
        model: document.getElementById("model").value,
        mode: selectedMode
    };


    try {

        const response = await fetch("/generate", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)
        });


        const result = await response.json();


        document.getElementById("rPhone").innerText =
            result.phone.toUpperCase();

        document.getElementById("rRam").innerText =
            result.ram + " GB";

        document.getElementById("rModel").innerText =
            result.model;

        document.getElementById("rDpi").innerText =
            result.dpi;

        document.getElementById("rFire").innerText =
            result.fire_button;


        document.getElementById("general").innerText =
            result.sensitivity.general;

        document.getElementById("red_dot").innerText =
            result.sensitivity.red_dot;

        document.getElementById("scope2").innerText =
            result.sensitivity["2x"];

        document.getElementById("scope4").innerText =
            result.sensitivity["4x"];

        document.getElementById("sniper").innerText =
            result.sensitivity.sniper;

        document.getElementById("free").innerText =
            result.sensitivity.free_look;


        document.getElementById("result").style.display =
            "block";

        status.innerText = "Settings generated successfully.";

        document.getElementById("result")
            .scrollIntoView({
                behavior: "smooth"
            });

    } catch (error) {

        status.innerText =
            "Error: Server is not running.";

    }
}

</script>

</body>
</html>
