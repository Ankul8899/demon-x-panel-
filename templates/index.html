
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMON X PANEL V4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080808;color:white;font-family:Arial}
header{text-align:center;color:#ff3030;font-size:26px;font-weight:bold;padding:20px}
.card{background:#171717;padding:20px;border:1px solid #444;border-radius:14px;margin-bottom:18px}
h3{color:#ff3030}
input,select{width:100%;padding:13px;margin:9px 0;background:#252525;color:white;border:1px solid #555;border-radius:8px}
button{width:100%;padding:14px;margin-top:12px;background:#e32636;color:white;border:0;border-radius:8px;font-weight:bold}
.hidden{display:none}
.result{white-space:pre-line;color:#00ff99;line-height:2}
.switch{text-align:center;color:#aaa;margin-top:15px}
.switch span{color:#ff3030}
</style>
</head>
<body>

<header>👹 DEMON X PANEL V4.0</header>

<!-- LOGIN PAGE -->
<div class="card" id="loginPage">
<h3>USER LOGIN</h3>
<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<div class="switch">New user? <span onclick="showRegister()">REGISTER</span></div>
</div>

<!-- REGISTER PAGE -->
<div class="card hidden" id="registerPage">
<h3>CREATE ACCOUNT</h3>
<input id="regUser" placeholder="Create Username">
<input id="regPass" type="password" placeholder="Create Password">
<button onclick="register()">REGISTER NOW</button>
<div class="switch">Already registered? <span onclick="showLogin()">LOGIN</span></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<h3>WELCOME TO DEMON X</h3>
<p>SMART AUTO SENSITIVITY GENERATOR</p>
<button onclick="logout()">LOGOUT</button>
</div>

<div class="card">
<h3>PHONE DETAILS</h3>

<label>Brand</label>
<select id="brand">
<option>OPPO</option>
<option>Samsung</option>
<option>Vivo</option>
<option>Realme</option>
<option>Redmi</option>
<option>iPhone</option>
<option>Other</option>
</select>

<label>Phone Model</label>
<input id="phone" placeholder="Enter phone model">

<label>RAM</label>
<select id="ram">
<option>3 GB</option>
<option>4 GB</option>
<option>6 GB</option>
<option>8 GB</option>
<option>12 GB</option>
</select>

<label>Gaming Style</label>
<select id="style">
<option value="balanced">Balanced</option>
<option value="one-tap">One Tap</option>
<option value="rush">Rush</option>
<option value="sniper">Sniper</option>
</select>

<button onclick="generateSensitivity()">GENERATE SETTINGS</button>
</div>

<div class="card hidden" id="resultBox">
<h3>GENERATOR RESULT</h3>
<div id="result" class="result"></div>
<button onclick="copySettings()">COPY ALL</button>
<button onclick="generateSensitivity()">REGENERATE</button>
</div>

</div>

<script>
function showRegister(){
 loginPage.classList.add("hidden");
 registerPage.classList.remove("hidden");
}
function showLogin(){
 registerPage.classList.add("hidden");
 loginPage.classList.remove("hidden");
}
async function register(){
 const username=regUser.value.trim();
 const password=regPass.value;
 if(!username || !password){alert("Fill all fields");return}
 try{
 const r=await fetch("/register",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username,password})
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.error||"Registration failed");
 alert("Registration successful! Please login.");
 showLogin();
 }catch(e){alert(e.message)}
}
async function login(){
 const username=loginUser.value.trim();
 const password=loginPass.value;
 if(!username || !password){alert("Fill all fields");return}
 try{
 const r=await fetch("/login",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username,password})
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.error||"Login failed");
 loginPage.classList.add("hidden");
 dashboard.classList.remove("hidden");
 }catch(e){alert(e.message)}
}
function logout(){
 dashboard.classList.add("hidden");
 loginPage.classList.remove("hidden");
}
async function generateSensitivity(){
 const phone=document.getElementById("phone").value.trim();
 if(!phone){alert("Enter phone model");return}
 try{
 const r=await fetch("/generate",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({
 brand:brand.value,
 phone,
 ram:ram.value,
 style:style.value
 })
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.error||"Generation failed");
 result.innerText=
`PHONE: ${brand.value} ${phone}
RAM: ${ram.value}

GENERAL: ${d.general}
RED DOT: ${d.red_dot}
2X SCOPE: ${d.scope_2x}
4X SCOPE: ${d.scope_4x}
SNIPER: ${d.sniper}
FREE LOOK: ${d.free_look}

DPI: ${d.dpi}
FIRE BUTTON: ${d.fire_button}%`;
 resultBox.classList.remove("hidden");
 }catch(e){alert(e.message)}
}
function copySettings(){
 navigator.clipboard.writeText(result.innerText)
 .then(()=>alert("Copied!"))
 .catch(()=>alert("Copy failed"));
}
</script>
</body>
</html>
