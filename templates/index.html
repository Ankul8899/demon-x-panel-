<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEMON X Sensitivity Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #050505, #111827, #020617);
    color: white;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #00e5ff;
    text-shadow: 0 0 20px #00e5ff;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.card {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #263449;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.08);
}

label {
    display: block;
    color: #00e5ff;
    font-weight: bold;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #020617;
    color: white;
    outline: none;
    margin-bottom: 17px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 174, 255, 0.35);
}

button:active {
    transform: scale(0.98);
}

.result {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.box {
    background: #020617;
    border: 1px solid #263449;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
}

.box span {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 7px;
}

.box strong {
    color: #00e5ff;
    font-size: 24px;
}

.sensitivity {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.sens-box {
    background: #020617;
    border-radius: 10px;
    padding: 13px;
    border-left: 3px solid #00e5ff;
}

.sens-box span {
    color: #aaa;
    font-size: 13px;
}

.sens-box strong {
    display: block;
    color: white;
    font-size: 20px;
    margin-top: 5px;
}

.status {
    text-align: center;
    color: #22c55e;
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">⚡ DEMON X</div>

    <div class="subtitle">
        Smart Sensitivity Generator
    </div>

    <!-- INPUT CARD -->
    <div class="card">

        <label>📱 Select Phone</label>

        <select id="phone">
            <option value="low">Low-End Phone</option>
            <option value="mid">Mid-Range Phone</option>
            <option value="high">High-End Phone</option>
            <option value="oppo">OPPO</option>
            <option value="redmi">Redmi</option>
            <option value="realme">Realme</option>
            <option value="samsung">Samsung</option>
            <option value="vivo">Vivo</option>
            <option value="oneplus">OnePlus</option>
        </select>


        <label>💾 RAM</label>

        <select id="ram">
            <option value="3">3 GB</option>
            <option value="4">4 GB</option>
            <option value="6">6 GB</option>
            <option value="8">8 GB</option>
            <option value="12">12 GB</option>
            <option value="16">16 GB</option>
        </select>


        <label>🎯 One Tap / Drag Mode</label>

        <select id="mode">
            <option value="one">One Tap</option>
            <option value="drag">Drag</option>
            <option value="balanced">Balanced</option>
        </select>


        <label>📱 Phone Model</label>

        <select id="model">

            <option value="a16">OPPO A16</option>
            <option value="a6x">OPPO A6x 5G</option>

            <option value="redmi12">Redmi 12</option>
            <option value="redmi13">Redmi 13</option>

            <option value="realmec">Realme C Series</option>

            <option value="samsungm">Samsung M Series</option>

            <option value="vivo">Vivo Y Series</option>

            <option value="oneplus">OnePlus Nord</option>

            <option value="custom">Custom Device</option>

        </select>

        <button onclick="generateSensitivity()">
            ⚡ GENERATE SENSITIVITY
        </button>

    </div>


    <!-- DPI + FIRE BUTTON -->
    <div class="card">

        <div class="result">

            <div class="box">
                <span>Recommended DPI</span>
                <strong id="dpi">---</strong>
            </div>

            <div class="box">
                <span>Fire Button Size</span>
                <strong id="fire">---</strong>
            </div>

        </div>

    </div>


    <!-- SENSITIVITY -->
    <div class="card">

        <label>🎮 Sensitivity</label>

        <div class="sensitivity">

            <div class="sens-box">
                <span>General</span>
                <strong id="general">---</strong>
            </div>

            <div class="sens-box">
                <span>Red Dot</span>
                <strong id="redDot">---</strong>
            </div>

            <div class="sens-box">
                <span>2X Scope</span>
                <strong id="twoX">---</strong>
            </div>

            <div class="sens-box">
                <span>4X Scope</span>
                <strong id="fourX">---</strong>
            </div>

            <div class="sens-box">
                <span>Sniper Scope</span>
                <strong id="sniper">---</strong>
            </div>

            <div class="sens-box">
                <span>Free Look</span>
                <strong id="freeLook">---</strong>
            </div>

        </div>

        <div class="status" id="status">
            Select settings and generate
        </div>

    </div>


    <!-- REGENERATE -->
    <div class="card">

        <button onclick="generateSensitivity()">
            🔄 REGENERATE SETTINGS
        </button>

    </div>

</div>


<script>

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


function generateSensitivity() {

    let phone = document.getElementById("phone").value;
    let ram = parseInt(document.getElementById("ram").value);
    let mode = document.getElementById("mode").value;
    let model = document.getElementById("model").value;

    let dpi;
    let fire;
    let general;
    let redDot;
    let twoX;
    let fourX;
    let sniper;
    let freeLook;


    /* -------------------------
       BASE DPI
    ------------------------- */

    if (ram <= 3) {
        dpi = randomNumber(380, 420);
    }

    else if (ram <= 4) {
        dpi = randomNumber(400, 450);
    }

    else if (ram <= 6) {
        dpi = randomNumber(420, 480);
    }

    else if (ram <= 8) {
        dpi = randomNumber(450, 520);
    }

    else {
        dpi = randomNumber(480, 560);
    }


    /* -------------------------
       PHONE MODEL ADJUSTMENT
    ------------------------- */

    if (model === "a16") {
        dpi -= 20;
    }

    if (model === "a6x") {
        dpi += 10;
    }

    if (model === "redmi12") {
        dpi += 5;
    }

    if (model === "redmi13") {
        dpi += 10;
    }

    if (model === "oneplus") {
        dpi += 20;
    }


    /* -------------------------
       MODE SETTINGS
    ------------------------- */

    if (mode === "one") {

        general = randomNumber(190, 200);
        redDot = randomNumber(185, 200);
        twoX = randomNumber(175, 190);
        fourX = randomNumber(165, 180);
        sniper = randomNumber(95, 115);
        freeLook = randomNumber(180, 200);

        fire = randomNumber(48, 55);
    }


    else if (mode === "drag") {

        general = randomNumber(180, 195);
        redDot = randomNumber(175, 190);
        twoX = randomNumber(165, 180);
        fourX = randomNumber(155, 175);
        sniper = randomNumber(90, 110);
        freeLook = randomNumber(170, 190);

        fire = randomNumber(50, 58);
    }


    else {

        general = randomNumber(185, 198);
        redDot = randomNumber(180, 195);
        twoX = randomNumber(170, 185);
        fourX = randomNumber(160, 178);
        sniper = randomNumber(90, 112);
        freeLook = randomNumber(175, 195);

        fire = randomNumber(48, 56);
    }


    /* -------------------------
       PHONE TYPE ADJUSTMENT
    ------------------------- */

    if (phone === "low") {

        general -= 5;
        redDot -= 5;
        twoX -= 5;
        fourX -= 5;
    }

    if (phone === "high") {

        general += 2;
        redDot += 2;
        twoX += 2;
    }


    /* -------------------------
       LIMIT VALUES
    ------------------------- */

    dpi = Math.max(350, Math.min(dpi, 600));

    general = Math.max(0, Math.min(general, 200));
    redDot = Math.max(0, Math.min(redDot, 200));
    twoX = Math.max(0, Math.min(twoX, 200));
    fourX = Math.max(0, Math.min(fourX, 200));
    sniper = Math.max(0, Math.min(sniper, 200));
    freeLook = Math.max(0, Math.min(freeLook, 200));


    /* -------------------------
       DISPLAY
    ------------------------- */

    document.getElementById("dpi").innerText = dpi;

    document.getElementById("fire").innerText = fire + "%";

    document.getElementById("general").innerText = general;

    document.getElementById("redDot").innerText = redDot;

    document.getElementById("twoX").innerText = twoX;

    document.getElementById("fourX").innerText = fourX;

    document.getElementById("sniper").innerText = sniper;

    document.getElementById("freeLook").innerText = freeLook;


    document.getElementById("status").innerText =
        "✓ New settings generated successfully";

}

</script>

</body>
</html>
